buildinfo.apiVersion=0.1.0
buildinfo.buildNumber=LOCAL
buildinfo.url=@buildinfo.url@

env.version=@project.version@
spring.liquibase.change-log=classpath:database/liquibase.xml
spring.liquibase.enabled=false
spring.profiles.active=@profile@
# debug=true

cache.standard-lookups=true

spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://ranpak-redux-secrets.vault.azure.net/

# Database configuration comes from Azure Key Vault
database.writer-url=${database-writer-url}
database.reader-url=${database-reader-url}
database.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
database.username=${database-username}
database.password=${database-password}

# Sugar CRM API information
sugarcrm.url=
sugarcrm.timeoutInMilliseconds=30000
sugarcrm.username=${sugarcrm-username}
sugarcrm.password=${sugarcrm-password}

# BTP Platform API Information
btpplatform.url=
btpplatform.timeoutInMilliseconds=30000
btpplatform.username=${btpplatform-username}
btpplatform.password=${btpplatform-password}

# FreshDesk Email Config
freshdesk.noam-email=
freshdesk.euapac-email=
freshdesk.from-address=noreply@ranpak.com

# Email Settings
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.host=${mail-host}
spring.mail.properties.mail.smtp.port=${mail-port}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=${mail-auth}
spring.mail.properties.mail.smtp.starttls.enable=${mail-tls-enabled}
spring.mail.properties.mail.smtp.starttls.required=${mail-tls-required}

auth.method=@auth.method@
auth.azure-client-id=${azure-client-id}
auth.azure-tenant-id=${azure-tenant-id}
auth.open-id-issuer-url=https://a6aib4fnb.accounts.ondemand.com
auth.open-id-client-id=${open-id-client-id}
auth.anonymous-issuer=https://localhost/
auth.ranpak-user-group-id=${ranpak-user-group-id}

error.debug=false
env.name=Default
two-factor.enable=false

management.endpoints.web.exposure.include=health
management.health.defaults.enabled=false

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=10240

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
